<!-- src/app/settings/settings.html -->
<div class="settings-shell">

  <!-- ═════ Sidebar ═════ -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="brand-square">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <div>
        <h1 class="sidebar__title">Settings</h1>
        <p class="sidebar__sub">Workspace configuration</p>
      </div>
    </div>

    <!-- Sidebar search -->
    <div class="sidebar__search">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Search settings…"
        [value]="searchQuery"
        (input)="searchQuery = $any($event.target).value"/>
    </div>

    <!-- Nav items -->
    <nav class="sidebar__nav">
      <button
        *ngFor="let s of filteredSections"
        class="nav-item"
        [class.nav-item--active]="activeSection === s.id"
        (click)="selectSection(s.id)">
        <div class="nav-item__icon" [style.background-color]="s.bgTint">
          <!-- Icon switch -->
          <svg *ngIf="s.icon === 'signal'" width="14" height="14" viewBox="0 0 24 24" fill="none" [attr.stroke]="s.color" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/>
          </svg>
          <svg *ngIf="s.icon === 'bot'" width="14" height="14" viewBox="0 0 24 24" fill="none" [attr.stroke]="s.color" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
          </svg>
          <svg *ngIf="s.icon === 'card'" width="14" height="14" viewBox="0 0 24 24" fill="none" [attr.stroke]="s.color" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          <svg *ngIf="s.icon === 'users'" width="14" height="14" viewBox="0 0 24 24" fill="none" [attr.stroke]="s.color" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="nav-item__text">
          <div class="nav-item__label-row">
            <span class="nav-item__label">{{ s.label }}</span>
            <span *ngIf="s.badge" class="nav-item__badge">{{ s.badge }}</span>
          </div>
          <span class="nav-item__desc">{{ s.description }}</span>
        </div>
        <svg class="nav-item__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <div *ngIf="filteredSections.length === 0" class="sidebar__empty">
        No settings match "{{ searchQuery }}"
      </div>
    </nav>

    <div class="sidebar__footer">
      <p class="sidebar__hint">Dash: <span>{{ dashId }}</span></p>
    </div>
  </aside>

  <!-- ═════ Main content ═════ -->
  <main class="content">
    <div class="content__header">
      <div class="content__title-row">
        <div class="content__icon" [style.background-color]="activeMeta?.bgTint">
          <svg *ngIf="activeMeta?.icon === 'signal'" width="16" height="16" viewBox="0 0 24 24" fill="none" [attr.stroke]="activeMeta?.color" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/>
          </svg>
          <svg *ngIf="activeMeta?.icon === 'bot'" width="16" height="16" viewBox="0 0 24 24" fill="none" [attr.stroke]="activeMeta?.color" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/>
          </svg>
        </div>
        <div>
          <h2 class="content__title">{{ activeMeta?.label }}</h2>
          <p class="content__sub">{{ activeMeta?.description }}</p>
        </div>
      </div>
    </div>

    <div class="content__body">
      <!-- 👇 Add a new <ng-container *ngIf="activeSection === 'xxx'"> for each new section -->
      <ng-container *ngIf="activeSection === 'channels'">
        <app-channel-management [dashId]="dashId"></app-channel-management>
      </ng-container>

      <ng-container *ngIf="activeSection === 'chatbot'">
        <app-chatbot [dashId]="dashId"></app-chatbot>
      </ng-container>
    </div>
  </main>
</div>
